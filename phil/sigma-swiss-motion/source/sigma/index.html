<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ς — the letter that only ends</title>
<style>
  /* One family for the whole film: Inter (OFL), Latin + Greek subsets, variable wght/opsz */
  @font-face { font-family: Inter; src: url(fonts/inter-latin.woff2) format('woff2'); font-weight: 100 900;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212, U+2215; }
  @font-face { font-family: Inter; src: url(fonts/inter-greek.woff2) format('woff2'); font-weight: 100 900;
    unicode-range: U+0370-03FF, U+1F00-1FFF; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
