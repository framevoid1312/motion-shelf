<script id="scene">
/* Pixel-art scene renderer. Pure function of time t in [0,P): every motion uses
   frequencies quantised to integer cycles per P, so render(0) === render(P). */
function createScene(P){
"use strict";
P = (P > 0) ? P : 600;
const W=640,H=360,N=W*H,CX=320,CY=118,F=200,TAU=Math.PI*2;

/* ---------------- utilities ---------------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sstep(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function hash(n){n|=0;n=Math.imul(n^(n>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return (n>>>0)/4294967296;}

let seed=20261109;function rnd(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/4294967296;}
function qf(per){return Math.max(1,Math.round(P/per))/P;}
function osc(per,t,ph){return Math.sin(TAU*(qf(per)*t+ph));}
function frac(x){return x-Math.floor(x);}
const BAY=new Float32Array([0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5]);for(let i=0;i<16;i++)BAY[i]=(BAY[i]+0.5)/16;
function RGB(r,g,b){r=r<0?0:r>255?255:r|0;g=g<0?0:g>255?255:g|0;b=b<0?0:b>255?255:b|0;return (r<<16)|(g<<8)|b;}
function cR(c){return c>>16&255;} function cG(c){return c>>8&255;} function cB(c){return c&255;}
function cmul(c,k){return RGB(cR(c)*k,cG(c)*k,cB(c)*k);}
function cmix(a,b,k){return RGB(cR(a)+(cR(b)-cR(a))*k,cG(a)+(cG(b)-cG(a))*k,cB(a)+(cB(b)-cB(a))*k);}
function cjit(c,amp,x,y,salt){const n=(h2(x*3+salt,y*7-salt*5)-0.5)*2*amp;return RGB(cR(c)+n,cG(c)+n,cB(c)+n);}

/* ---------------- buffers ---------------- */
const out=new Uint8ClampedArray(N*4);
for(let i=0;i<N;i++)out[i*4+3]=255;
const bR=new Uint8Array(N),bG=new Uint8Array(N),bB=new Uint8Array(N),bS=new Uint8Array(N);
const fR=new Uint8Array(N),fG=new Uint8Array(N),fB=new Uint8Array(N),fS=new Uint8Array(N),fM=new Uint8Array(N);
const aR=new Uint8Array(N),aG=new Uint8Array(N),aB=new Uint8Array(N),aS=new Uint8Array(N);
const wx=new Float32Array(N),wy=new Float32Array(N),wz=new Float32Array(N),rv=new Uint8Array(N);
const Ml=new Float32Array(N),Ms=new Float32Array(N),Mo=new Float32Array(N),vig=new Float32Array(N);
const addL=new Float32Array(N),addS=new Float32Array(N),addO=new Float32Array(N);
/* surface ids: 1 ceiling 2 back 3 left 4 right 5 floor 8 window-opening 9 crt-glass 10 dynamic object */
const NX=[0,0,0,1,-1,0,0],NY=[0,-1,0,0,0,1,0],NZ=[0,0,-1,0,0,0,-1];

let tR,tG,tB,tS,tM,curS=0,curRv=0,keepRv=false;
function useBase(){tR=bR;tG=bG;tB=bB;tS=bS;tM=null;}
function useFg(){tR=fR;tG=fG;tB=fB;tS=fS;tM=fM;}
function useFrame(){tR=aR;tG=aG;tB=aB;tS=aS;tM=null;}
function put(i,c){tR[i]=c>>16&255;tG[i]=c>>8&255;tB[i]=c&255;tS[i]=curS;if(tM!==null)tM[i]=1;if(tR!==aR&&!keepRv)rv[i]=curRv;}
function pset(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=W||y>=H)return;put(y*W+x,c);}
function rect(x,y,w,h,c){for(let j=Math.max(0,y);j<Math.min(H,y+h);j++)for(let i=Math.max(0,x);i<Math.min(W,x+w);i++)put(j*W+i,c);}
function rectF(x,y,w,h,fn){for(let j=Math.max(0,y);j<Math.min(H,y+h);j++)for(let i=Math.max(0,x);i<Math.min(W,x+w);i++){const c=fn(i,j);if(c>=0)put(j*W+i,c);}}
function line(x0,y0,x1,y1,c){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){pset(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function ell(cx,cy,rx,ry,c){const x0=Math.floor(cx-rx),x1=Math.ceil(cx+rx),y0=Math.floor(cy-ry),y1=Math.ceil(cy+ry);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const u=(x+0.5-cx)/rx,v=(y+0.5-cy)/ry;if(u*u+v*v<=1)pset(x,y,c);}}
function ellF(cx,cy,rx,ry,fn){const x0=Math.floor(cx-rx),x1=Math.ceil(cx+rx),y0=Math.floor(cy-ry),y1=Math.ceil(cy+ry);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const u=(x+0.5-cx)/rx,v=(y+0.5-cy)/ry;if(u*u+v*v<=1&&x>=0&&y>=0&&x<W&&y<H){const c=fn(x,y,u,v);if(c>=0)put(y*W+x,c);}}}

const PX=new Float64Array(64),PY=new Float64Array(64),IX=new Float64Array(64);
function scan(n,cb){let mn=1e9,mx=-1e9;for(let k=0;k<n;k++){if(PY[k]<mn)mn=PY[k];if(PY[k]>mx)mx=PY[k];}
  const y0=Math.max(0,Math.ceil(mn-0.5)),y1=Math.min(H-1,Math.floor(mx-0.5));
  for(let y=y0;y<=y1;y++){const sy=y+0.5;let m=0;
    for(let k=0,j=n-1;k<n;j=k++){const ya=PY[j],yb=PY[k];if((ya<=sy&&yb>sy)||(yb<=sy&&ya>sy))IX[m++]=PX[j]+(sy-ya)*(PX[k]-PX[j])/(yb-ya);}
    for(let a=1;a<m;a++){const v=IX[a];let b=a-1;while(b>=0&&IX[b]>v){IX[b+1]=IX[b];b--;}IX[b+1]=v;}
    for(let a=0;a+1<m;a+=2){const xa=Math.max(0,Math.ceil(IX[a]-0.5)),xb=Math.min(W-1,Math.floor(IX[a+1]-0.5));for(let x=xa;x<=xb;x++)cb(x,y,y*W+x);}}}
let fillCol=0;function cbCol(x,y,i){put(i,fillCol);}
function poly(pts,c){const n=pts.length>>1;for(let k=0;k<n;k++){PX[k]=pts[2*k];PY[k]=pts[2*k+1];}fillCol=c;scan(n,cbCol);}
function polyF(pts,fn){const n=pts.length>>1;for(let k=0;k<n;k++){PX[k]=pts[2*k];PY[k]=pts[2*k+1];}scan(n,function(x,y,i){const c=fn(x,y);if(c>=0)put(i,c);});}
function sx3(X,Z){return CX+F*X/Z;} function sy3(Y,Z){return CY-F*Y/Z;}
/* plane helpers: iterate pixels of a screen bbox, invert onto plane, call fn(planeCoords..., x, y) */
function planeY(Yp,x0,y0,x1,y1,fn){for(let y=Math.max(0,y0);y<=Math.min(H-1,y1);y++){const d=CY-(y+0.5);if(Math.abs(d)<1e-6)continue;const Z=F*Yp/d;if(Z<=0)continue;
  for(let x=Math.max(0,x0);x<=Math.min(W-1,x1);x++){const X=(x+0.5-CX)*Z/F;const c=fn(X,Z,x,y);if(c>=0)put(y*W+x,c);}}}
function planeX(Xp,x0,y0,x1,y1,fn){for(let x=Math.max(0,x0);x<=Math.min(W-1,x1);x++){const d=x+0.5-CX;if(Math.abs(d)<1e-6)continue;const Z=F*Xp/d;if(Z<=0)continue;
  for(let y=Math.max(0,y0);y<=Math.min(H-1,y1);y++){const Y=(CY-(y+0.5))*Z/F;const c=fn(Z,Y,x,y);if(c>=0)put(y*W+x,c);}}}

/* ---------------- events ---------------- */
const EXPORT_EVENTS=/*EVENTS*/{"cars":[{"t":2.5,"d":4.2,"dir":1},{"t":20.6,"d":3.6,"dir":-1}],"gusts":[{"t":8.8,"d":5.6,"s":1.0},{"t":25.4,"d":3.8,"s":0.55}],"plow":[{"t":12.4,"d":7.6}],"clumps":[{"t":7.3,"x":0.36},{"t":16.9,"x":0.58}],"flicker":[{"t":17.7,"d":1.3}],"twitch":[1.6,10.7,15.0,23.9,28.2]}/*END*/;
function genEvents(){
  const e={cars:[],gusts:[],plow:[],clumps:[],flicker:[],twitch:[]};
  if(P<=30.0001)return JSON.parse(JSON.stringify(EXPORT_EVENTS));
  seed=777;
  if(P>=120){const pt=P*(0.35+0.3*rnd());e.plow.push({t:pt,d:7.6});}
  let t=4+rnd()*12;
  while(t+5<P){let ok=true;for(const p of e.plow)if(t+5>p.t-1&&t<p.t+p.d+1)ok=false;
    if(ok)e.cars.push({t:t,d:3.4+rnd()*1.4,dir:rnd()<0.5?1:-1});t+=20+rnd()*40;}
  t=6+rnd()*8;while(t+7<P){const d=3.5+rnd()*3;e.gusts.push({t:t,d:d,s:0.45+rnd()*0.55});t+=d+7+rnd()*16;}
  t=5+rnd()*10;while(t+2<P){e.clumps.push({t:t,x:0.15+rnd()*0.7});t+=9+rnd()*22;}
  t=15+rnd()*20;while(t+3<P){e.flicker.push({t:t,d:0.8+rnd()*1.2});t+=30+rnd()*50;}
  t=1+rnd()*4;while(t+1<P){e.twitch.push(t);t+=3+rnd()*7;}
  return e;

const EV=genEvents();
/* gust */
const GK=45;let gustA=0;for(const g of EV.gusts)gustA+=GK*g.s*g.d*0.5;

function gustInt(t){let s=0;const G=EV.gusts;for(let k=0;k<G.length;k++){const u=(t-G[k].t)/G[k].d;let b;if(u<=0)b=0;else if(u>=1)b=0.5;else b=u*0.5-Math.sin(TAU*u)/(4*Math.PI);s+=GK*G[k].s*G[k].d*b;}return s;}
/* sodium flicker */
function kOf(t){let k=1;const L=EV.flicker;for(let n=0;n<L.length;n++){const u=t-L[n].t;if(u>=0&&u<L[n].d){const h=h2(Math.floor(u*16),n*13+5);
  k=h<0.42?0.22+0.3*h:(h<0.62?0.72:1.0);if(u<0.05||u>L[n].d-0.05)k=Math.max(k,0.8);}}return k;}
/* car / plow state */
let carOn=false,carLx=0,carI=0,carU=0,carDir=1,plowOn=false,plowLx=0,plowI=0,plowU=0;
function evState(t){carOn=false;carI=0;const C=EV.cars;for(let k=0;k<C.length;k++){const u=(t-C[k].t)/C[k].d;if(u>0&&u<1){carOn=true;carU=u;carDir=C[k].dir;carLx=carDir*(-13+26*u);carI=Math.pow(Math.sin(Math.PI*u),1.3);}}
  plowOn=false;plowI=0;const Q=EV.plow;for(let k=0;k<Q.length;k++){const u=(t-Q[k].t)/Q[k].d;if(u>0&&u<1){plowOn=true;plowU=u;plowLx=-7+14*u;const env=sstep(0,0.12,u)*(1-sstep(0.88,1,u));
    const c=Math.cos(TAU*qf(0.8)*t);plowI=env*(0.1+0.9*Math.pow(Math.max(0,c),3));}}}

/* ---------------- static: room shell ---------------- */
useBase();
for(let y=0;y<H;y++){const v=CY-(y+0.5);for(let x=0;x<W;x++){const u=x+0.5-CX;let Z=3,s=2;
  if(v>0){const z=1.3*F/v;if(z<Z){Z=z;s=1;}}else if(v<0){const z=1.25*F/-v;if(z<Z){Z=z;s=5;}}
  if(u<0){const z=1.8*F/-u;if(z<Z){Z=z;s=3;}}else if(u>0){const z=1.8*F/u;if(z<Z){Z=z;s=4;}}
  const X=u*Z/F,Y=v*Z/F,i=y*W+x;let c,d;
  if(s===1){d=Math.min(3-Z,1.8-Math.abs(X));c=cjit(RGB(150,158,162),4,x,y,1);
    const sd=Math.hypot(X-0.95,Z-2.55);if(sd<0.22&&sd>0.17)c=cmul(c,0.9);else if(sd<=0.17)c=cmul(c,0.96);}
  else if(s===5){d=Math.min(3-Z,1.8-Math.abs(X));const q=(X+5)/0.13,idx=Math.floor(q);
    let b=RGB(96,70,52);b=cmul(b,0.86+0.24*hash(idx*7+3));b=cjit(b,5,idx,Math.floor(Z*30),9);
    const off=hash(idx*11)*1.4;const zq=(Z+off)/1.4;
    if(frac(q)*0.13<0.0042*Z||frac(zq)*1.4<Z*Z/(F*1.25)*1.1)b=RGB(46,34,27);c=b;}
  else{const along=s===2?X:Z;d=s===2?Math.min(1.3-Y,Y+1.25,1.8-Math.abs(X)):Math.min(1.3-Y,Y+1.25,3-Z);
    c=s===2?RGB(118,140,140):RGB(112,134,136);if(frac(along/0.16)<0.5)c=cmul(c,1.035);c=cjit(c,3,x,y,s);
    if(Y<-1.13)c=Y<-1.115&&Y>-1.135?RGB(120,114,104):RGB(80,74,66);}
  c=cmul(c,0.66+0.34*sstep(0,0.3,d));
  curS=s;curRv=s;put(i,c);wx[i]=X;wy[i]=Y;wz[i]=Z;}}

/* ceiling fan canopy + downrod (static) */
curS=0;curRv=0;
poly([314,8,326,8,324,11,316,11],RGB(120,100,70));
rect(319,11,2,13,RGB(70,60,48));

/* ---------------- window (back wall) ---------------- */
const OX0=267,OY0=41,OW=72,OH=99,ON=OW*OH;
curS=8;curRv=2;keepRv=true;rect(OX0,OY0,OW,OH,0);keepRv=false;
curS=0;curRv=0;
const frameC=RGB(196,192,180),sashU=RGB(184,180,168),sashL=RGB(192,188,176);
rect(263,37,80,4,frameC);rect(263,37,4,104,frameC);rect(339,37,4,104,frameC);
// upper sash
rect(267,41,72,3,sashU);rect(267,88,72,3,sashU);rect(267,41,3,50,sashU);rect(336,41,3,50,sashU);rect(302,44,2,44,sashU);
// lower sash (raised, in front)
rect(267,66,72,3,sashL);rect(267,112,72,4,sashL);rect(267,66,3,50,sashL);rect(336,66,3,50,sashL);rect(302,69,2,43,sashL);
rect(296,115,10,1,RGB(150,140,110)); // sash lift handle
// sill / stool
rect(259,140,88,3,RGB(206,200,186));rect(259,143,88,3,RGB(150,144,132));rect(259,146,88,1,RGB(40,40,44));rect(263,147,80,3,RGB(172,166,154));
// window mask for light transmission
const winT=new Float32Array(ON),glassK=new Float32Array(ON),frost=new Float32Array(ON);
function paneCornerFrost(x,y,x0,y0,x1,y1){const d=Math.min(Math.hypot(x-x0,y-y1),Math.hypot(x-x1,y-y1),Math.hypot(x-x0,y-y0)*1.4,Math.hypot(x-x1,y-y0)*1.4);
  const n=h2(x*5,y*3)*0.55+h2(x>>1,y>>1)*0.45;return clamp(1.0-d/6.5+(n-0.5)*0.8,0,1);}
for(let ly=0;ly<OH;ly++)for(let lx=0;lx<OW;lx++){const x=OX0+lx,y=OY0+ly,j=ly*OW+lx;let T=1,g=1,fr=0;
  if(y<116){const upper=y<91,lower=y>=66;
    let rail=false;
    if(upper&&(y<44||(y>=88&&y<91)||x<270||x>=336||(x>=302&&x<304)))rail=true;
    if(lower&&(y<69||y>=112||x<270||x>=336||(x>=302&&x<304)))rail=true;
    if(rail){T=0;g=0;}
    else{const dbl=upper&&lower;g=dbl?0.6:0.78;T=g;
      const px0=x<302?270:304,px1=x<302?301:335;
      if(upper){fr=Math.max(fr,paneCornerFrost(x,y,px0,44,px1,87));}
      if(lower){fr=Math.max(fr,paneCornerFrost(x,y,px0,69,px1,111));}
      T*=1-0.55*fr;}
    if(y>=41&&y<44)T=0; else if(y>=45&&y<78&&((y-45)%3)<2)T*=0.12; else if(y>=78&&y<80)T=0;}
  winT[j]=T;glassK[j]=g;frost[j]=fr;}

/* radiator */
for(let k=0;k<16;k++){const x=271+k*4;rectF(x,158,3,38,function(i,j){let c=RGB(132,138,140);if(i===x)c=RGB(150,156,158);if(i===x+2)c=RGB(100,104,108);if(j<160)c=cmul(c,1.08);return c;});}
rect(270,190,66,2,RGB(96,100,104));rect(272,196,2,5,RGB(60,62,66));rect(331,196,2,5,RGB(60,62,66));
rect(266,170,4,4,RGB(110,96,70));rect(262,171,4,2,RGB(90,90,94));

/* back-wall poster above bed */
keepRv=true;curS=2;
rectF(384,50,43,58,function(x,y){const u=(x-384)/43,v=(y-50)/58;let c=RGB(30,40,70);
  if(v>0.2&&v<0.62){const d=Math.hypot(u-0.5,(v-0.42)*1.36);if(d<0.27)c=v<0.5?RGB(222,140,80):RGB(196,96,70);if(d<0.27&&((y-50)%4===3)&&v>0.43)c=RGB(30,40,70);}

  return c;});
/* right-wall poster (on plane X=1.8) */
planeX(1.8,465,10,535,120,function(Z,Y,x,y){if(Z<1.75||Z>2.35||Y<0.1||Y>0.86)return -1;const u=(2.35-Z)/0.6,v=(0.86-Y)/0.76;
  let c=RGB(40,26,48);const dx=u-0.5,dy=v-0.38;const d=Math.hypot(dx,dy*0.9);

keepRv=false;curS=0;curRv=0;

/* bookshelf on left wall */
const BOOKC=[0x7A3B32,0x2F4F6A,0x5E6B3A,0x8C7A5A,0x3E3550,0x9A8E70,0x6A2E2E,0x2E5A55,0xB0A080,0x48484C,0x8A5A30,0x50607A];
const shelves=[-0.70,-0.24,0.22];const books=[];
for(let s=0;s<3;s++){let z=1.58;const L=[];while(z<2.47){if(rnd()<0.08){z+=0.03+rnd()*0.03;continue;}const w=0.02+rnd()*0.028;if(z+w>2.47)break;

<script>
