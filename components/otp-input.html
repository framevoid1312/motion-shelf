<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Time Code · Motion Shelf UI components</title>
<!-- Six code boxes that pop as digits land, shake red on a wrong code and ripple green, box by box, when it&#x27;s right. Paste works too.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- otp-input --- */
.w{display:grid;gap:16px;justify-items:center}
.row{display:flex;gap:clamp(6px,1.6vw,10px)}
.row input{width:clamp(40px,11vw,56px);height:clamp(52px,14vw,68px);border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:700 clamp(22px,6vw,30px) var(--fm);text-align:center;outline:none;caret-color:var(--accent);transition:border-color .2s,box-shadow .2s,background .3s,color .3s}
.row input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}
.row input.g{background:var(--good);border-color:var(--good);color:#fff}
.row input.r{border-color:var(--bad);color:var(--bad);background:color-mix(in oklab,var(--bad) 8%,var(--surface))}
.row.shake{animation:sh .42s}
@keyframes sh{20%{translate:-9px}40%{translate:8px}60%{translate:-5px}80%{translate:2px}}
.msg{height:22px;font:600 14px var(--fb);display:flex;align-items:center;gap:6px}
.msg.ok{color:var(--good)}.msg.no{color:var(--bad)}
.hint{font:500 11.5px var(--fm);color:var(--muted)}
</style></head><body>
<div class="w">
  <div class="row" id="row" role="group" aria-label="Verification code"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="hint">demo code: 246810</div>
</div>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const row=document.getElementById('row'),msg=document.getElementById('msg'),CODE='246810';let lock=false,gen=0,demoing=false;
const I=[...Array(6)].map((_,i)=>{const e=document.createElement('input');e.inputMode='numeric';e.autocomplete=i?'off':'one-time-code';e.maxLength=1;e.setAttribute('aria-label','Digit '+(i+1));row.append(e);return e});
const pop=e=>e.animate([{scale:1},{scale:1.1},{scale:1}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'});
function put(i,d,focus){I[i].value=d;pop(I[i]);if(focus&&i<5)I[i+1].focus();if(I.every(x=>x.value))verify()}
async function verify(){
  if(lock)return;lock=true;const g=gen,v=I.map(x=>x.value).join('');
  if(v===CODE){for(const e of I){e.classList.add('g');e.animate([{translate:'0 0'},{translate:'0 -6px'},{translate:'0 0'}],{duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'});await FC.wait(60)}
    msg.className='msg ok';msg.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>Verified';
    await FC.wait(2000);if(g===gen)reset()}
  else{I.forEach(e=>e.classList.add('r'));row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');msg.className='msg no';msg.textContent='That code didn’t work';
    await FC.wait(900);if(g===gen)reset(true)}
}
function reset(focus){I.forEach(e=>{e.value='';e.classList.remove('g','r')});if(focus!==true)msg.textContent='';lock=false;if(focus===true&&!FC.idle)I[0].focus()}
I.forEach((e,i)=>{
  e.addEventListener('input',()=>{const d=e.value.replace(/\D/g,'');if(d.length>1){paste(d);return}e.value=d;if(d)put(i,d,true)});
  e.addEventListener('keydown',ev=>{if(ev.key==='Backspace'&&!e.value&&i){I[i-1].value='';I[i-1].focus();ev.preventDefault()}if(ev.key==='ArrowLeft'&&i)I[i-1].focus();if(ev.key==='ArrowRight'&&i<5)I[i+1].focus()});
  e.addEventListener('paste',ev=>{ev.preventDefault();paste((ev.clipboardData.getData('text')||'').replace(/\D/g,''))});
  e.addEventListener('focus',()=>e.select());
});
/* a real user takes over from the demo: wipe whatever the demo left behind */
row.addEventListener('pointerdown',e=>{if(e.isTrusted&&(demoing||lock)){gen++;demoing=false;reset();}},true);
row.addEventListener('keydown',e=>{if(e.isTrusted&&(demoing||lock)&&!/^Tab$/.test(e.key)){gen++;demoing=false;reset();}},true);
function paste(d){d.slice(0,6).split('').forEach((c,j)=>{I[j].value=c;pop(I[j])});if(d.length>=6)verify();else I[Math.min(d.length,5)].focus()}
FC.demo(async()=>{
  demoing=true;
  for(const code of ['246180',CODE]){
    for(let i=0;i<6;i++){if(!FC.idle||!demoing)return;I[i].value=code[i];pop(I[i]);await FC.wait(170)}
    await verify();await FC.wait(500);
  }
  demoing=false;await FC.wait(800);
});
</script>
</body></html>
