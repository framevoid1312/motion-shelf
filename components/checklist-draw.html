<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drawn Checklist · Motion Shelf UI components</title>
<!-- Checkboxes that draw their tick with a pen stroke while a line strikes through the task, and a progress bar fills along the top.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- checklist-draw --- */
.card{width:min(380px,88vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px 12px;box-shadow:0 18px 40px -26px rgba(0,0,0,.5)}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd h2{margin:0;font:800 28px/1 var(--fd);text-transform:uppercase}
.hd span{font:500 12px var(--fm);color:var(--muted);font-variant-numeric:tabular-nums}
.pg{height:4px;border-radius:9px;background:var(--chip);margin:12px 0 6px;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .5s var(--out)}
label{display:flex;align-items:center;gap:14px;padding:12px 0;cursor:pointer;border-top:1px solid var(--line)}
label:first-of-type{border-top:0}
input{position:absolute;opacity:0;width:1px;height:1px}
.bx{position:relative;flex:none;width:24px;height:24px;border-radius:7px;border:1.8px solid var(--line);transition:background .25s,border-color .25s}
.bx svg{position:absolute;inset:3px}
.bx path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .2s}
input:checked+.bx{background:var(--accent);border-color:var(--accent)}
input:checked+.bx path{stroke-dashoffset:0;transition:stroke-dashoffset .3s .08s var(--out)}
input:focus-visible+.bx{outline:2px solid var(--accent);outline-offset:3px}
.tx{position:relative;font-size:16px;transition:color .3s}
.tx::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:var(--ink);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .25s var(--out)}
input:checked~.tx{color:var(--muted)}
input:checked~.tx::after{transform:scaleX(1);background:var(--muted);transition:transform .45s .1s var(--out)}
</style></head><body>
<div class="card">
  <div class="hd"><h2>Render day</h2><span id="cnt">0 of 3</span></div>
  <div class="pg"><i id="pg"></i></div>
  <label><input type="checkbox"><span class="bx"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span><span class="tx">Storyboard the beats</span></label>
  <label><input type="checkbox"><span class="bx"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span><span class="tx">Render the 4K master</span></label>
  <label><input type="checkbox"><span class="bx"><svg viewBox="0 0 24 24" fill="none" stroke="var(--on)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg></span><span class="tx">Mix to −14 LUFS</span></label>
</div>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const boxes=[...document.querySelectorAll('input')],pg=document.getElementById('pg'),cnt=document.getElementById('cnt');
function upd(e){const n=boxes.filter(b=>b.checked).length;pg.style.width=n/3*100+'%';cnt.textContent=n+' of 3';
  if(e&&e.target.checked)e.target.nextElementSibling.animate([{scale:1},{scale:.8},{scale:1.12},{scale:1}],{duration:420,easing:'cubic-bezier(.34,1.56,.64,1)'})}
boxes.forEach(b=>b.addEventListener('change',upd));
FC.demo(async()=>{
  for(const b of boxes){if(!await FC.wait(700))return;b.checked=true;upd({target:b})}
  if(!await FC.wait(1500))return;
  for(const b of boxes.slice().reverse()){b.checked=false;upd();await FC.wait(120)}
  await FC.wait(500);
});
</script>
</body></html>
