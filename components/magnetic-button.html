<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic Button · Motion Shelf UI components</title>
<!-- A call-to-action that leans toward the pointer as it gets close, its label moving a little further than the button for depth. Clicks ripple from where you pressed.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- magnetic-button --- */
.mb{position:relative;border:0;border-radius:999px;padding:24px 42px;background:var(--ink);color:var(--bg);font:600 19px var(--fb);cursor:pointer;overflow:hidden;will-change:transform;transition:scale .15s;box-shadow:0 14px 30px -14px rgba(0,0,0,.45)}
.mb:active,.mb.press{scale:.96}
.mb .lbl{position:relative;z-index:1;display:inline-flex;gap:10px;align-items:center;will-change:transform}
.rp{position:absolute;border-radius:50%;background:var(--accent);pointer-events:none;width:20px;height:20px;margin:-10px}
.fake{position:fixed;left:0;top:0;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent);opacity:0;pointer-events:none;transition:opacity .35s}
.fake.on{opacity:.9}
</style></head><body>
<button class="mb" id="mb"><span class="lbl" id="lbl">Get started <span aria-hidden="true">→</span></span></button>
<i class="fake" id="fake" aria-hidden="true"></i>
<div class="cap">bring your pointer close</div>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const mb=document.getElementById('mb'),lbl=document.getElementById('lbl'),fake=document.getElementById('fake');
let real=null,bx=0,by=0,lx=0,ly=0,lastReal=-1e9;
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;real={x:e.clientX,y:e.clientY};lastReal=performance.now();FC.touch()});
document.addEventListener('pointerleave',()=>real=null);
function press(x,y){
  const r=mb.getBoundingClientRect(),rp=document.createElement('i');rp.className='rp';rp.style.left=(x-r.left)+'px';rp.style.top=(y-r.top)+'px';mb.append(rp);
  const s=Math.hypot(r.width,r.height)/10;
  rp.animate([{transform:'scale(0)',opacity:.9},{transform:`scale(${s})`,opacity:0}],{duration:700,easing:'cubic-bezier(.22,1,.36,1)'}).finished.then(()=>rp.remove());
  lbl.innerHTML='✓ On it';clearTimeout(press.t);press.t=setTimeout(()=>lbl.innerHTML='Get started <span aria-hidden="true">→</span>',1100);
}
mb.addEventListener('click',e=>press(e.clientX||mb.getBoundingClientRect().left+mb.offsetWidth/2,e.clientY||mb.getBoundingClientRect().top+mb.offsetHeight/2));
let lastDemoPress=0;
FC.raf((t)=>{
  const r=mb.getBoundingClientRect(),cx=r.left+r.width/2-bx,cy=r.top+r.height/2-by;
  const demo=!real&&FC.idle&&!FC.reduce&&performance.now()-lastReal>1500;
  let p=real;
  if(demo){p={x:cx+Math.cos(t/900)*Math.min(230,innerWidth*.38),y:cy+Math.sin(t/640)*Math.min(130,innerHeight*.3)};fake.style.transform=`translate(${p.x}px,${p.y}px)`;
    if(Math.hypot(p.x-cx,p.y-cy)<40&&t-lastDemoPress>4000){lastDemoPress=t;mb.classList.add('press');setTimeout(()=>mb.classList.remove('press'),160);press(p.x,p.y)}}
  fake.classList.toggle('on',demo);
  let tx=0,ty=0,ux=0,uy=0;
  if(p){const dx=p.x-cx,dy=p.y-cy,d=Math.hypot(dx,dy),R=180;if(d<R){const k=1-d/R;tx=dx*.35*k*1.6;ty=dy*.35*k*1.6;ux=dx*.18*k;uy=dy*.18*k}}
  bx+=(tx-bx)*.15;by+=(ty-by)*.15;lx+=(ux-lx)*.15;ly+=(uy-ly)*.15;
  mb.style.transform=`translate(${bx.toFixed(2)}px,${by.toFixed(2)}px)`;
  lbl.style.transform=`translate(${lx.toFixed(2)}px,${ly.toFixed(2)}px)`;
});
</script>
</body></html>
