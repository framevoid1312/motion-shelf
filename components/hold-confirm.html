<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold to Confirm · Motion Shelf UI components</title>
<!-- A destructive button that has to be held down. A red fill sweeps across, inverting the label as it goes, and drains away if you let go early.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- hold-confirm --- */
.hd{position:relative;width:240px;height:58px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;overflow:hidden;font:600 16px var(--fb);color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;transition:border-color .2s,scale .2s}
.hd:hover{border-color:var(--bad)}
.hd.held{scale:.98}
.lay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:9px}
.fill{background:var(--bad);color:#fff;clip-path:inset(0 calc(100% - var(--p,0%)) 0 0 round 999px)}
.done .fill{clip-path:inset(0 0 0 0)}
.lay.ok{color:#fff;opacity:0;background:var(--bad)}
.done .lay.ok{opacity:1}
.ok path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .1s var(--out)}
.done .ok path{stroke-dashoffset:0}
.hint{margin-top:14px;font:500 12px var(--fm);color:var(--muted);text-align:center;height:16px}
.wrap{display:grid;justify-items:center}
</style></head><body>
<div class="wrap">
<button class="hd" id="hd" aria-describedby="hint">
  <span class="lay" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Hold to delete</span>
  <span class="lay fill" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Hold to delete</span>
  <span class="lay ok" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>Deleted</span>
  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" id="sr">Hold to delete</span>
</button>
<div class="hint" id="hint" aria-live="polite">press and hold</div>
</div>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const hd=document.getElementById('hd'),hint=document.getElementById('hint'),sr=document.getElementById('sr');
let p=0,held=false,done=false;const DUR=1100;
function hold(v){if(done)return;held=v;hd.classList.toggle('held',v);hint.textContent=v?'keep holding…':'press and hold'}
hd.addEventListener('pointerdown',e=>{hd.setPointerCapture(e.pointerId);hold(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>hd.addEventListener(n,()=>hold(false)));
hd.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();hold(true)}});
hd.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')hold(false)});
hd.addEventListener('click',e=>e.preventDefault());
FC.raf((t,dt)=>{
  if(done)return;
  p+=held?dt/DUR:-dt/DUR*3;p=Math.max(0,Math.min(1,p));
  hd.style.setProperty('--p',(p*100).toFixed(2)+'%');
  if(p>=1){done=true;held=false;hd.classList.remove('held');hd.classList.add('done');hint.textContent='deleted';sr.textContent='Deleted';
    hd.animate([{scale:1},{scale:1.05},{scale:1}],{duration:380,easing:'cubic-bezier(.34,1.56,.64,1)'});
    setTimeout(()=>{hd.classList.remove('done');p=0;done=false;hint.textContent='press and hold';sr.textContent='Hold to delete'},1600)}
});
FC.demo(async()=>{
  hold(true);if(!await FC.wait(520))return hold(false);hold(false);if(!await FC.wait(900))return;
  hold(true);await FC.wait(1250);hold(false);await FC.wait(2400);
});
</script>
</body></html>
