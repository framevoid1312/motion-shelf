<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Label Field · Motion Shelf UI components</title>
<!-- An email field whose label lifts and shrinks out of the way, with an underline that draws from the centre and a check that pops in once the address is valid.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- floating-label --- */
.f{width:min(360px,86vw)}
.fl{position:relative;display:block;padding-top:18px}
.fl input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:500 20px var(--fb);padding:10px 34px 10px 0;outline:none;border-radius:0}
.lab{position:absolute;left:0;top:28px;font:500 18px var(--fb);color:var(--muted);transform-origin:left top;transition:transform .25s var(--out),color .2s;pointer-events:none}
.fl:focus-within .lab,.fl.on .lab,.fl input:not(:placeholder-shown)~.lab{transform:translateY(-24px) scale(.78);color:var(--accent)}
.ln{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .45s var(--out),background .2s}
.fl:focus-within .ln,.fl.on .ln{transform:scaleX(1)}
.ok{position:absolute;right:2px;bottom:12px;width:24px;height:24px;border-radius:50%;background:var(--good);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.fl.valid .ok{transform:scale(1)}
.fl.bad .ln{background:var(--bad);transform:scaleX(1)}
.fl.bad .lab{color:var(--bad)}
.hint{position:relative;height:20px;margin:10px 0 0;font-size:13.5px;color:var(--muted);overflow:hidden}
.hint span{position:absolute;inset:0;transition:transform .35s var(--out),opacity .25s}
.hint .e{color:var(--bad);transform:translateY(100%);opacity:0}
.f.err .hint .n{transform:translateY(-100%);opacity:0}
.f.err .hint .e{transform:none;opacity:1}
</style></head><body>
<form class="f" id="f" onsubmit="return false" novalidate>
  <label class="fl" id="fl"><input id="in" type="email" placeholder=" " autocomplete="off" spellcheck="false" aria-describedby="hint"><span class="lab">Email address</span><i class="ln"></i>
    <span class="ok" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span></label>
  <p class="hint" id="hint" aria-live="polite"><span class="n">We'll never share it.</span><span class="e">That doesn't look like an email.</span></p>
</form>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const f=document.getElementById('f'),fl=document.getElementById('fl'),inp=document.getElementById('in');
const ok=v=>/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v);
function check(blur){const v=inp.value;fl.classList.toggle('valid',ok(v));const bad=v&&!ok(v)&&(blur||f.classList.contains('err'));fl.classList.toggle('bad',!!bad);f.classList.toggle('err',!!bad)}
inp.addEventListener('input',()=>check(false));inp.addEventListener('blur',()=>check(true));
FC.demo(async()=>{
  if(document.activeElement===inp)return FC.wait(1000);
  fl.classList.add('on');if(!await FC.wait(500))return fl.classList.remove('on');
  for(const ch of 'phil@studio'){inp.value+=ch;check(false);if(!await FC.wait(70+Math.random()*60))return}
  fl.classList.remove('on');check(true);if(!await FC.wait(1400))return;fl.classList.add('on');
  for(const ch of '.dev'){inp.value+=ch;check(false);if(!await FC.wait(110))return}
  if(!await FC.wait(1700))return;
  while(inp.value){inp.value=inp.value.slice(0,-1);check(false);await FC.wait(22)}
  fl.classList.remove('on');check(false);await FC.wait(900);
});
</script>
</body></html>
