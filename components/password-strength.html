<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Strength · Motion Shelf UI components</title>
<!-- A password field with a four-segment meter that fills and changes colour as rules tick off below, each with a drawn check.
     From Phil's Motion Shelf: https://github.com/framevoid1312/motion-shelf — free to use. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@100..900&family=Figtree:wght@300..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f7fa;--surface:#fff;--ink:#151821;--muted:#5b6172;--line:#d5d9e3;--chip:#e3e7f2;--accent:#2944d6;--on:#fff;--mark:#ffd84d;--good:#14915f;--bad:#d6453d;color-scheme:light;
--fd:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12141b;--surface:#1c1f2a;--ink:#e8eaf2;--muted:#9aa1b5;--line:#2c3142;--chip:#252a39;--accent:#8ea0ff;--on:#11131a;--mark:#e9c53a;--good:#3ecf8e;--bad:#ff6b61;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cap{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:500 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.fc-paused *,.fc-paused *::before,.fc-paused *::after{animation-play-state:paused!important}
/* --- password-strength --- */
.w{width:min(380px,88vw);display:grid;gap:12px}
.lbl{font:600 14px var(--fb)}
.fld{position:relative}
.fld input{width:100%;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 18px var(--fm);padding:0 52px 0 16px;outline:none;transition:border-color .2s,box-shadow .2s}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 20%,transparent)}
.eye{position:absolute;right:6px;top:6px;width:40px;height:40px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--chip)}
.eye .x{transition:stroke-dashoffset .3s;stroke-dasharray:24;stroke-dashoffset:24}
.eye[aria-pressed=false] .x{stroke-dashoffset:0}
.mt{display:flex;align-items:center;gap:12px}
.seg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.seg i{height:6px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.seg i::after{content:"";position:absolute;inset:0;background:var(--c,var(--bad));transform:scaleX(0);transform-origin:left;transition:transform .4s var(--out),background .3s}
.seg i.on::after{transform:none}
.tag{position:relative;width:82px;height:18px;font:600 12px var(--fm);text-align:right;color:var(--c,var(--muted))}
ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px}
li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);transition:color .25s}
li .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
li .ck path{stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .35s .05s var(--out)}
li.ok{color:var(--ink)}
li.ok .ck{background:var(--good);border-color:var(--good)}
li.ok .ck path{stroke-dashoffset:0}
</style></head><body>
<div class="w">
  <label class="lbl" for="pw">Create a password</label>
  <div class="fld"><input id="pw" type="password" autocomplete="new-password" spellcheck="false" aria-describedby="tag rules">
    <button class="eye" id="eye" aria-pressed="false" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="x" d="M4 4l16 16"/></svg></button></div>
  <div class="mt"><div class="seg" id="seg" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span class="tag" id="tag" aria-live="polite"></span></div>
  <ul id="rules"><li data-r="len"><span class="ck"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>8+ characters</li>
  <li data-r="up"><span class="ck"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>An uppercase letter</li>
  <li data-r="num"><span class="ck"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>A number</li>
  <li data-r="sym"><span class="ck"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>A symbol</li></ul>
</div>
<script>
/* Motion Shelf runtime: autoplay demo when idle, pause when off-screen, theme */
(function(){
var q=new URLSearchParams(location.search),de=document.documentElement,th=q.get('theme');
if(th==='light'||th==='dark')de.dataset.theme=th;
var FC=window.FC={paused:false,idle:true,reduce:matchMedia('(prefers-reduced-motion: reduce)').matches&&!q.has('demo')};
var sleep=FC.sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var to;FC.touch=function(){FC.idle=false;clearTimeout(to);to=setTimeout(function(){FC.idle=true},6000)};
['pointerdown','keydown','wheel'].forEach(function(n){addEventListener(n,function(e){if(e.isTrusted)FC.touch()},{passive:true,capture:true})});
addEventListener('message',function(e){var d=e.data;
  if(d==='fc:pause'||d==='fc:play'){FC.paused=d==='fc:pause';de.classList.toggle('fc-paused',FC.paused)}
  else if(d&&d.fcTheme){if(d.fcTheme==='auto')delete de.dataset.theme;else de.dataset.theme=d.fcTheme}});
FC.gate=async function(){while(FC.paused)await sleep(120)};
/* wait ms of un-paused time; resolves true if the demo should keep going */
FC.wait=async function(ms){var left=ms;while(left>0){var s=performance.now();await sleep(Math.min(left,60));if(!FC.paused)left-=performance.now()-s}return FC.idle};
FC.demo=function(fn){if(FC.reduce)return;(async function(){await FC.wait(450);for(;;){while(FC.paused||!FC.idle)await sleep(250);await fn()}})()};
FC.raf=function(fn){var last=performance.now(),t=0;function f(n){var dt=Math.min(n-last,64);last=n;if(!FC.paused){t+=dt;fn(t,dt)}requestAnimationFrame(f)}requestAnimationFrame(f)};
})();
</script>
<script>
const pw=document.getElementById('pw'),eye=document.getElementById('eye'),segs=[...document.querySelectorAll('.seg i')],tag=document.getElementById('tag');
const R={len:v=>v.length>=8,up:v=>/[A-Z]/.test(v),num:v=>/\d/.test(v),sym:v=>/[^A-Za-z0-9]/.test(v)};
const names=['','Too weak','Okay','Strong','Excellent'],cols=['var(--bad)','var(--bad)','var(--mark)','var(--good)','var(--accent)'];
let last=-1;
function upd(){
  const v=pw.value;let s=0;
  document.querySelectorAll('li').forEach(li=>{const ok=R[li.dataset.r](v);li.classList.toggle('ok',ok);if(ok)s++});
  if(v.length>=14)s++;s=Math.min(4,s);if(v&&!s)s=1;
  if(s===last)return;last=s;
  document.documentElement.style.setProperty('--c',v?cols[s]:'var(--muted)');
  segs.forEach((g,i)=>setTimeout(()=>g.classList.toggle('on',i<s),i*40));
  tag.textContent=v?names[s]:'';
  tag.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.22,1,.36,1)'});
}
pw.addEventListener('input',upd);
eye.addEventListener('click',()=>{const on=eye.getAttribute('aria-pressed')!=='true';eye.setAttribute('aria-pressed',on);eye.setAttribute('aria-label',on?'Hide password':'Show password');pw.type=on?'text':'password'});
upd();
FC.demo(async()=>{
  if(document.activeElement===pw)return FC.wait(1000);
  for(const target of ['sunset','Sunset42!','Sunset42!harbour']){
    while(!target.startsWith(pw.value)){pw.value=pw.value.slice(0,-1);upd();await FC.wait(40)}
    for(const ch of target.slice(pw.value.length)){if(!FC.idle)return;pw.value+=ch;upd();await FC.wait(85+Math.random()*60)}
    if(!await FC.wait(1100))return;
  }
  while(pw.value){pw.value=pw.value.slice(0,-1);upd();await FC.wait(25)}
  await FC.wait(700);
});
</script>
</body></html>
