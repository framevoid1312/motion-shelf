<!doctype html><meta charset="utf-8"><title>render grid</title><style>
html,body{margin:0;background:#000;overflow:hidden}#g{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.t{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#111}
.t iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}</style><div id="g"></div><script>
(async()=>{const items=await (await fetch('items.json')).json();const p=+(new URLSearchParams(location.search).get('page')||0);
const page=items.slice(p*9,p*9+9);const g=document.getElementById('g');const W=innerWidth/3;
for(const it of page){const d=document.createElement('div');d.className='t';const f=document.createElement('iframe');
f.width=it.w;f.height=it.h;const s=Math.max(W/it.w,(W*9/16)/it.h);f.style.transform='scale('+s+')';f.src=it.src;d.appendChild(f);g.appendChild(d);}
window.__seekAll=()=>{document.querySelectorAll('iframe').forEach(f=>{try{const w=f.contentWindow;const P=w.__player;const D=P&&P.getDuration?P.getDuration():6;P&&P.renderSeek&&P.renderSeek(D*0.55)}catch(e){}})};
window.__names=page.map(x=>x.n);})();</script>
